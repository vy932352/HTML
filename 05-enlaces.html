<!--

Enlaces

Los enlaces nos permiten crear navegación interna y externas html.

Sintasis:

<a href=>"..."</a>

Los enlaces requieren del atributo ´href´para funcionar como elementos interactivos.

El atributo href puede recibir varios valores, los principales:
Url externa
La ruta (path) de un archivo html
El id de un elemento html
#Deadlink (enlace muerto)

El atributo "target" nos permite indicarle al enlace que se debe abrir en una pestaña nueva cuando el valor "_blank".
-->

<!DOCTYPE html>
<html lang="es">
    <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0"
     <title>Enlaces</Title>
    </head>
