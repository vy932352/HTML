<!--


contenido incrustado (iframe)
sirve para incrustar contenido externo como videos de youtube, mapas de google, documentos, interfaces etc.

- src: URL del contenido externo
- width: ancho del contenido
- height: alto del contenido
- allowfullscreen: permite que la pantalla completa




-->

<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>iframe</title>
    </head>
    <body>
        <h1>iframe </h1>

        <h2>youtube</h2>

        <iframe width="560" height="315" src="https://www.youtube.com/embed/UNQgyIAfAVA?si=Oy_Z_tFQqijteM4t" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

        <h2>google maps</h2>

        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3914.7977261766587!2d-77.60864173811524!3d-11.128437257715978!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9106df00362548e1%3A0x9f3312ca1331249d!2sCasa%20de%20Izuku%20Midoriya!5e0!3m2!1ses-419!2smx!4v1792444965320!5m2!1ses-419!2smx" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>


        <h2>heyzine flipbook enfoco</h2>
        <iframe src="https://heyzine.com/flip-book/383f213883.html" width="100%" height="600px" frameborder="0" allowfullscreen></iframe>

        <h2></h2>

    </body>
</html>
