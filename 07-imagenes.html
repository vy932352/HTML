<!--
Para colocar imagenes en html usamos la etiqueta;
<img />

Esta etiqueta de autocierre en html 5 la etiqueta ya no es necesaria, pero se considera una buena practica utilizarla.

El atributo "src" le indica a la etiqueta la ruta de la imagen que queremos mostrar. Puede recibir una url externa o una ruta interna.

El atributo "alt" es un texto alternativo que se mostrara en caso de que la imagen no pueda ser cargada. Este atributo es obligatorio porque se utiliza como apoyo en accesibilidad.

Los atributos "width" y "height" nos permiten manipular el tamaño de la imagen en html. Se recomienda no utilizar estos atributos para definir el tamaño de la imagen, sino que se recomienda utilizar CSS para definir el tamaño de la imagen.
-->

<!DOCTYPE html>
<html lang="es">    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Imagenes</title>
    </head>
    <body>
        <h1>Imagenes</h1>
        <p>Las imagenes nos permiten colocar elementos visules en los sitios web.</p>

        <h2>imagen externa</h2>
        <img src="https://picsum.photos/200/300" alt="Imagen aleatoria de Lorem Picsum">

        <h2>imagen interna</h2>
        <img src="images/jin.jpg" alt="Kim Seokjin (Jin). MAMA 2019" width="200px">
    </body>
