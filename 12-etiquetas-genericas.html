<!-- Etiquetas genéricas 
 Existen dos tipos que nos ayudan a crear elementos de tipo bloque y línea. 
    <div>...</div> Se usa como un contenedor de división y semánticamente no significa nada. Sirve como contenedor de bloque.
    <span>...</span> Es un contenedor de tipo línea, se suele usar para encerrar palabras o pequeños textos. Semánticamente no significa nada.

    Contenedor de bloque: Ocupa todo el ancho disponible y darán un salto de línea. 
    Contenedor de línea: Ocupa solo el ancho de su contenido y no da un salto de línea.
    El buscador de google no aprovecha esta semántica para puntuar mejor los sitios web.

-->

<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Etiquetas genéricas</title>
    </head>
    <body>
        <h1> Etiquetas genéricas </h1>
        <p>Las etiquetas genéricas son elementos que no tienen un significado semántico específico, pero nos permiten estructurar el contenido de nuestra página web.</p>

        <div>
            Soy un <span style="color: #f00 ">elemento</span> de bloque. 
        </div>

        <span>
            Soy otro elemento de bloque. <span>Y este es otro elemento de línea. </span>
        </span>

    </body>
</html>
