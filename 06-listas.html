<!-- 

 Listas         
 
 Nos ayudan a estructurar información de manera ordenada y no ordenada

 Ordenadas:
 Llevan numeración y la sinaxis es:
 <ol>...</ol>

 No ordenadas:
 Llevan bullets o viñestas y la sinaxis es:
 <ul>...</ul>

Para los elementos de la lista se utiliza la sintaxis:
<li>...</li>

Existe el atributo type que permite cambiar el tipo de numeración y bullet en una lista:

Para listas ordenadas:
Tipo numeración
Tipo alfabeto
Tipo romano

Para listas no ordenadas:   
Bullet
ALfabeto
Romano
--> 

<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Listas</title>
    </head>
    <body>
        <h1>Listas</h1>
        <p>Tenemos listas ordenadas y no ordenadas.</p>

        <h2>Top 3 idols más vrgs</h2>
        <ol type="i">
            <li>Min Yoongi</li>
            <li>Choi Yeonjun</li>
            <li>Hatsune Miku</li>
        </ol>

        <h2>Top 3 proyectadas</h2>
        <ul type="circle">    
            <li>Mirrorball</li>
            <li>Anti Hero</li>
            <li>So far Away</li>
        </ul>
    </body>
</html>
