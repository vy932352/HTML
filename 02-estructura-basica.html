<!-- 
 
  Estructura basica 
  
  <!DOCTYPE html> Declara el tipo de documento y la versión de HTML que se está utilizando.

  

<head> Contiene metadatos sobre el documento, p, ej. conjunto de caracteres, vista para dispositivos móviles o el título del documento.

<body> Contiene el contenido visible del documento, como titulos, párrafos, imágenes, formularios...

-->

<!DOCTYPE html>
<html>
    <head></head>
    <body></body>
</html>
