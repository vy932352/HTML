<!--

 Para crear la estructura básica podemos usar Emmet.

 Emmet es una herramienta de autocompletado integrada en VSC.

 El short cut para crear la estructura: ! + Enter

 Atributos

 lang: determina el idioma en el que está escrito el documento.
 charset: determina el conjunto de caracteres que se usa en el documento.

 Etiquetas

 Meta viewport: Permite que el documento se muestre correctamente en dispositivos móviles. Siempre debe de estar.
 Title: define el título del documento. Este título es visible para el usuario y se ubica en las pestañas del navegador.

-->

  <!DOCTYPE html>
  <html lang="en">
  <head>
     <meta charset="UTF-8">
     <meta http-equiv="X-UA-Compatible" content="IE=edge">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>
  </head>
  <body>

  </body>
  </html>
